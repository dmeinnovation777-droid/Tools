name: Tests & Windows build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the core test suite
        run: python -m unittest discover -s tests -v

  headless-gui:
    name: Headless GUI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tkinter and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: AutoTuner Backup Tool
        run: xvfb-run -a -s "-screen 0 1000x800x24" python tests/smoke_gui_autotuner.py
      - name: MHD Lock Tool
        run: xvfb-run -a -s "-screen 0 1040x820x24" python tests/smoke_gui_mhd_lock.py

  build-windows:
    name: Build Windows executables
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build AutoTuner Backup Tool
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name "AutoTuner Backup Tool" --icon assets/dme-icon.ico autotuner_tool.py
      - name: Build MHD Lock Tool
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name "MHD Lock Tool" --icon assets/dme-icon.ico mhd_lock_tool.py
      - name: Upload executables
        uses: actions/upload-artifact@v4
        with:
          name: dme-tools-windows
          path: dist/*.exe
          if-no-files-found: error
