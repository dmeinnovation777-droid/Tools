name: Tests & Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so a tagged build can publish the installer as a release asset.
permissions:
  contents: write

jobs:
  test:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the core test suite
        run: python -m unittest discover -s tests -v

  headless-gui:
    name: Headless GUI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tkinter and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: AutoTuner Backup Tool
        run: xvfb-run -a -s "-screen 0 1000x800x24" python tests/smoke_gui_autotuner.py
      - name: MHD Lock Tool
        run: xvfb-run -a -s "-screen 0 1040x820x24" python tests/smoke_gui_mhd_lock.py
      - name: Suite launcher
        run: xvfb-run -a -s "-screen 0 880x560x24" python tests/smoke_gui_suite.py

  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Read the suite version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import dme_brand; print(dme_brand.VERSION)')" >> "$GITHUB_OUTPUT"
      - name: Build the launcher
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name "DME Innovation Tools" --icon assets/dme-icon.ico dme_suite.py
      - name: Build AutoTuner Backup Tool
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name "AutoTuner Backup Tool" --icon assets/dme-icon.ico autotuner_tool.py
      - name: Build MHD Lock Tool
        run: >
          pyinstaller --onefile --windowed --noconfirm --clean
          --name "MHD Lock Tool" --icon assets/dme-icon.ico mhd_lock_tool.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: >
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          /DAppVersion=${{ steps.version.outputs.value }}
          installer\dme-innovation-tools.iss
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: DME-Innovation-Tools-Setup-${{ steps.version.outputs.value }}
          path: dist/DME-Innovation-Tools-Setup-*.exe
          if-no-files-found: error
      - name: Upload the plain executables
        uses: actions/upload-artifact@v4
        with:
          name: dme-tools-windows-exe
          path: |
            dist/DME Innovation Tools.exe
            dist/AutoTuner Backup Tool.exe
            dist/MHD Lock Tool.exe
          if-no-files-found: error

      # A tag turns the build into a public download that never expires.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          SETUP="dist/DME-Innovation-Tools-Setup-${VERSION}.exe"
          test -f "$SETUP"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$SETUP" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$SETUP" \
              --title "DME Innovation Tools ${VERSION}" \
              --notes-file installer/RELEASE_NOTES.md
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
